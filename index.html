    body::before { content: ""; position: fixed; inset: 0 0 auto; z-index: 30; height: 4px; background: linear-gradient(90deg, #0c2747, var(--primary), #76add7, #17283c); }
    body::after { display: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: clamp(1.55rem, 4vw, 2.2rem); letter-spacing: -.045em; }
    h2 { margin-bottom: 16px; font-size: 1.18rem; }
    h3 { margin-bottom: 6px; font-size: 1rem; }

    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 30px 0 64px; }
    .public-shell { width: min(1040px, calc(100% - 28px)); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 22px; }
    .eyebrow { margin-bottom: 6px; color: var(--primary); font-size: .72rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin-bottom: 0; }
    .brand-lockup { display: flex; gap: 13px; align-items: center; min-width: 0; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; overflow: hidden; font-size: .96rem; letter-spacing: -.02em; text-overflow: ellipsis; white-space: nowrap; }
    .brand-mark { position: relative; display: inline-grid; flex: 0 0 auto; place-items: center; width: 64px; height: 64px; overflow: hidden; border: 1px solid rgba(106,130,154,.38); border-radius: 18px; color: #fff; background: #edf1f5; box-shadow: 0 13px 30px rgba(6, 20, 38, .2), inset 0 0 0 1px rgba(255,255,255,.75); }
    .brand-mark::after { display: none; }
    .brand-mark img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .top-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; color: var(--primary); background: var(--surface-soft); font-size: .79rem; font-weight: 800; white-space: nowrap; }
    .badge.test { color: var(--warning); background: var(--warning-soft); }

    .panel, .stat, .auth-card { background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(246,248,250,.91)); border: 1px solid rgba(190, 203, 216, .78); border-radius: var(--radius); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter: blur(14px); }
    .panel { padding: 22px; }
    .auth-wrap { min-height: 72vh; display: grid; place-items: center; }
    .auth-card { width: min(440px, 100%); padding: 26px; }
    .auth-card .brand-mark { margin-bottom: 18px; }
    .notice { padding: 13px 15px; margin-bottom: 18px; border: 1px solid #f0d49b; border-radius: 14px; color: var(--warning); background: var(--warning-soft); font-size: .9rem; line-height: 1.45; }
    .notice.info { color: var(--primary); border-color: #b8cffb; background: var(--surface-soft); }
    .notice.success { color: var(--success); border-color: #a6e2c3; background: var(--success-soft); }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { position: relative; overflow: hidden; padding: 17px; }
    .stat::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(180deg, var(--primary), var(--cyan)); }
    .stat-label { margin-bottom: 6px; color: var(--muted); font-size: .8rem; }
    .stat-value { font-size: 1.72rem; font-weight: 900; letter-spacing: -.04em; }

    .nav { display: flex; gap: 7px; padding: 5px; margin-bottom: 18px; overflow-x: auto; border: 1px solid var(--border); border-radius: 15px; background: rgba(222,229,236,.76); backdrop-filter: blur(10px); }
    .nav-btn { flex: 0 0 auto; padding: 9px 12px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; font-size: .83rem; font-weight: 800; }
    .nav-btn.active { color: var(--text); background: #fff; box-shadow: 0 4px 12px rgba(20, 32, 51, .08); }

    .grid { display: grid; grid-template-columns: minmax(280px, .78fr) minmax(0, 1.35fr); gap: 18px; align-items: start; }
    .grid.equal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
    .panel-head h2 { margin: 0; }
    .stack { display: grid; gap: 11px; }

    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: .81rem; font-weight: 780; }
    input, select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; outline: none; transition: border-color .18s ease, box-shadow .18s ease; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 77, 134, .14); }
    textarea { min-height: 76px; resize: vertical; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .check { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: .83rem; line-height: 1.4; }
    .hint { color: var(--muted); font-size: .76rem; line-height: 1.35; }

    .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 12px; color: var(--text); background: var(--surface); font-weight: 850; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .btn:hover { background: #f8fafc; }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { color: #fff; border-color: var(--primary); background: linear-gradient(135deg, #28679f, var(--primary-dark)); box-shadow: 0 10px 24px rgba(17,61,105,.24); }
    .btn.primary:hover { background: linear-gradient(135deg, #3479b4, #082a52); box-shadow: 0 12px 28px rgba(17,61,105,.3); }
    .btn.success { color: var(--success); border-color: #a6e2c3; background: var(--success-soft); }
    .btn.danger { color: var(--danger); border-color: #f2b8b2; background: var(--danger-soft); }
    .btn.small { min-height: 34px; padding: 6px 9px; font-size: .77rem; }
    .btn[disabled] { opacity: .55; cursor: wait; }

    .appointment-list, .availability-list { display: grid; gap: 10px; }
    .appointment, .availability-item { padding: 14px; border: 1px solid var(--border); border-radius: 14px; }
    .appointment-top, .availability-item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .appointment p { margin: 3px 0 0; color: var(--muted); font-size: .86rem; }
    .status { display: inline-flex; padding: 5px 8px; border-radius: 999px; font-size: .72rem; font-weight: 850; white-space: nowrap; }
    .status.scheduled { color: var(--primary); background: var(--surface-soft); }
    .status.completed { color: var(--success); background: var(--success-soft); }
    .status.cancelled { color: var(--danger); background: var(--danger-soft); }
    .message-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .flag { display: inline-flex; gap: 5px; align-items: center; padding: 4px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .72rem; }
    .flag.sent { color: var(--success); border-color: #a6e2c3; background: var(--success-soft); }
    .flag.failed { color: var(--danger); border-color: #f2b8b2; background: var(--danger-soft); }
    .appointment-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
    .empty { padding: 26px 16px; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); text-align: center; }

    .booking-hero { position: relative; overflow: hidden; padding: 42px; margin-bottom: 14px; color: #fff; border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background:
      linear-gradient(118deg, transparent 0 34%, rgba(130,175,212,.12) 34.4%, transparent 35.2% 61%, rgba(255,255,255,.08) 61.3%, transparent 62%),
      radial-gradient(circle at 84% 7%, rgba(104,167,220,.25), transparent 15rem),
      linear-gradient(132deg, #061427 0%, #102d4e 55%, #1a568e 100%); box-shadow: 0 27px 58px rgba(5, 25, 51, .26), inset 0 1px 0 rgba(255,255,255,.12); }
    .booking-hero::before { content: ""; position: absolute; right: -75px; top: -110px; width: 310px; height: 310px; border: 55px solid rgba(255,255,255,.055); border-radius: 50%; }
    .booking-hero::after { content: ""; position: absolute; right: 132px; bottom: -92px; width: 190px; height: 190px; border: 1px solid rgba(133,187,228,.29); border-radius: 50%; }
    .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(245px, .65fr); gap: 42px; align-items: end; }
    .booking-hero h1 { max-width: 650px; margin-bottom: 15px; font-size: clamp(2.35rem, 6vw, 4.4rem); line-height: .95; letter-spacing: -.065em; }
    .booking-hero h1 span { color: var(--cyan); }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function businessBrand(name) {
      const parts = String(name || 'LocalFlow').split('|').map(part => part.trim()).filter(Boolean);
      const primary = parts[0] || 'LocalFlow';
      const secondary = parts.slice(1).join(' | ') || 'Recovery & Performance';
      const words = primary.split(/\s+/).filter(Boolean);
      const initials = words.length > 1
        ? (words[0].charAt(0) + words[1].charAt(0)).toUpperCase()
        : primary.slice(0, 2).toUpperCase();
      return { primary, secondary, initials };
    }

    function brandLogoMarkup() {
      return '<div class="brand-mark" role="img" aria-label="Logo Tomas Chianello"></div>';
    }

    function money(value) {
      return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(value || 0));
    }

    const pendingRpc = new Map();

    window.addEventListener('message', event => {
      const message = event && event.data;
      if (!message || message.source !== 'localflow-rpc' || !message.requestId) return;
      const pending = pendingRpc.get(message.requestId);
      if (!pending) return;
      pendingRpc.delete(message.requestId);
      clearTimeout(pending.timeout);
      pending.cleanup();
      if (message.ok) pending.resolve(message.data);
      else pending.reject(new Error(message.error || 'Errore di comunicazione con LocalFlow.'));
    });

    function api(method, ...args) {
      return new Promise((resolve, reject) => {
        const requestId = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'lf-' + Date.now() + '-' + Math.random().toString(16).slice(2);
        const frameName = 'localflow_rpc_' + requestId.replace(/[^a-zA-Z0-9_-]/g, '');
        const iframe = document.createElement('iframe');
        const form = document.createElement('form');

        iframe.name = frameName;
        iframe.title = 'LocalFlow';
        iframe.setAttribute('aria-hidden', 'true');
        iframe.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none';

        form.method = 'POST';
        form.action = LOCALFLOW_API_URL;
        form.target = frameName;
        form.style.display = 'none';

        const addField = (name, value) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        };

        addField('transport', 'iframe');
        addField('rpc', JSON.stringify({ requestId, method, args }));

        const cleanup = () => {
          form.remove();
          iframe.remove();
        };
        const timeout = setTimeout(() => {
          pendingRpc.delete(requestId);
          cleanup();
          reject(new Error('Il server non ha risposto. Controlla la connessione e riprova.'));
        }, 45000);

        pendingRpc.set(requestId, { resolve, reject, timeout, cleanup });
        document.body.appendChild(iframe);
        document.body.appendChild(form);
        form.submit();
      });
    }

    function saveMock(data) { localStorage.setItem(MOCK_KEY, JSON.stringify(data)); }
    function mockDateLabel(date) { const p = date.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
    function localTodayIso() {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }
    function requireMockPin(data, pin) { if (!data.pin || data.pin !== String(pin)) throw new Error('PIN non corretto.'); }
    function mockDuration(item) { return Math.max(15, Math.min(480, Number(item.serviceDuration || 60))); }
    function mockEndAt(item) { return Number(item.startAt) + mockDuration(item) * 60 * 1000; }
    function mockOverlap(first, second) { return Number(first.startAt) < mockEndAt(second) && mockEndAt(first) > Number(second.startAt); }
    function mockSlotInside(slot, appointment) {
      const startAt = new Date(slot.date + 'T' + slot.time).getTime();
      return startAt >= Number(appointment.startAt) && startAt < mockEndAt(appointment);
    }
    function mockTravelQuote(city, settings) {
      if (!settings.homeServiceEnabled) return { enabled: false, distanceKm: 0, roundTripKm: 0, travelFee: 0 };
      if (!String(city || '').trim()) throw new Error('Inserisci la citt\u00e0 in cui verr\u00e0 effettuato il massaggio.');
      if (Number(settings.fuelPricePerLiter || 0) <= 0) throw new Error('Configura il prezzo medio della benzina nella gestione.');
      const isLissone = /lissone/i.test(city);
      const distanceKm = isLissone ? 0 : 22.4;
      const includedKm = Number(settings.includedDistanceKm || 0);
      const chargeableRoundTripKm = distanceKm > includedKm ? distanceKm * 2 : 0;
      const exact = chargeableRoundTripKm * Number(settings.fuelConsumptionPer100Km || 6) / 100 * Number(settings.fuelPricePerLiter || 0);
      return {
        enabled: true, destination: String(city).trim(), distanceKm, roundTripKm: distanceKm * 2,
        includedDistanceKm: includedKm, chargeableRoundTripKm: Math.round(chargeableRoundTripKm * 10) / 10,
        fuelLiters: Math.round(chargeableRoundTripKm * Number(settings.fuelConsumptionPer100Km || 6)) / 100,
        travelFee: Math.round(Math.max(0, exact) / 5) * 5
      };
    }
    function mockAdminData(data) {
      const unique = new Set(data.appointments.map(item => item.phone));
      return {
        appointments: data.appointments.slice().sort((a, b) => a.startAt - b.startAt),
        availability: data.availability.filter(item => item.active).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)),
        settings: data.settings,

          clients: unique.size,
          reviewRequests: data.appointments.filter(item => item.reviewStatus === 'sent').length
        }
      };
    }
    async function mockApi(method, args) {
      await new Promise(resolve => setTimeout(resolve, 180));
      const data = mockState();
      if (method === 'getBootstrap') return { view: args[0], configured: Boolean(data.pin), publicConfig: data.settings };
      if (method === 'initializeAdmin') { if (data.pin) throw new Error('Il PIN \u00e8 gi\u00e0 configurato.'); data.pin = String(args[0]); saveMock(data); return mockAdminData(data); }
      if (method === 'getAdminData') { requireMockPin(data, args[0]); return mockAdminData(data); }
      if (method === 'getAvailableSlots') {
        const scheduled = data.appointments.filter(a => a.status === 'scheduled');
        const earliestBookableAt = Date.now() + Number(data.settings.minimumBookingNoticeMinutes || 0) * 60 * 1000;
        const groups = {};
        data.availability.filter(x => x.active && new Date(x.date + 'T' + x.time).getTime() >= earliestBookableAt && !scheduled.some(item => mockSlotInside(x, item))).forEach(x => {
          groups[x.date] = groups[x.date] || [];
          groups[x.date].push({ id: x.id, time: x.time, startAt: new Date(x.date + 'T' + x.time).getTime() });
        });
        return Object.keys(groups).sort().map(date => ({ date, label: mockDateLabel(date), slots: groups[date].sort((a,b) => a.time.localeCompare(b.time)) }));
      }
      if (method === 'calculateTravel') return mockTravelQuote(args[0], data.settings);
      if (method === 'addAvailability') {
        requireMockPin(data, args[0]); const payload = args[1];
        String(payload.times).split(',').map(x => x.trim()).filter(Boolean).forEach(time => {
          if (!data.availability.some(x => x.active && x.date === payload.date && x.time === time)) data.availability.push({ id: crypto.randomUUID(), date: payload.date, time, active: true });
        });
        saveMock(data); return mockAdminData(data);
      }
      if (method === 'removeAvailability') { requireMockPin(data, args[0]); const found = data.availability.find(x => x.id === args[1]); if (found) found.active = false; saveMock(data); return mockAdminData(data); }
      if (method === 'createBooking' || method === 'createAdminAppointment') {
        const payload = method === 'createBooking' ? args[0] : args[1];
        if (method === 'createAdminAppointment') requireMockPin(data, args[0]);
        const selectedService = data.settings.services.find(service => service.name === payload.service) || {};
        const travel = data.settings.homeServiceEnabled && payload.clientCity
          ? mockTravelQuote(payload.clientCity, data.settings)
          : { distanceKm: 0, roundTripKm: 0, travelFee: 0 };
        const item = Object.assign({}, payload, {
          id: crypto.randomUUID(), createdAt: new Date().toISOString(), startAt: new Date(payload.date + 'T' + payload.time).getTime(),
          status: 'scheduled', source: method === 'createBooking' ? 'booking' : 'admin',
          confirmationStatus: data.settings.phoneNumberId ? 'sent' : 'pending', reminderStatus: 'pending', reviewStatus: 'pending', completedAt: '',
          servicePrice: Number(selectedService.price || 0), serviceDuration: Number(selectedService.duration || 0),
          distanceKm: travel.distanceKm, roundTripKm: travel.roundTripKm, travelFee: travel.travelFee,
          totalPrice: Number(selectedService.price || 0) + Number(travel.travelFee || 0)
        });
        if (method === 'createBooking' && !data.availability.some(slot => slot.active && slot.date === item.date && slot.time === item.time)) {
          throw new Error('Questo orario non \u00e8 pi\u00f9 disponibile. Scegline un altro.');
        }
        if (method === 'createBooking' && item.startAt < Date.now() + Number(data.settings.minimumBookingNoticeMinutes || 0) * 60 * 1000) {
          throw new Error('Questo orario non \u00e8 pi\u00f9 prenotabile. Scegli un orario successivo.');
        }
        if (data.appointments.some(existing => existing.status === 'scheduled' && mockOverlap(item, existing))) {
          throw new Error('Questo appuntamento si sovrappone a un altro gi\u00e0 registrato.');
        }
        data.appointments.push(item);
        data.availability.forEach(slot => { if (slot.active && slot.date === item.date && mockSlotInside(slot, item)) slot.active = false; });
        saveMock(data);
        return method === 'createBooking' ? { ok: true, id: item.id, businessName: data.settings.businessName, dateLabel: mockDateLabel(item.date), time: item.time, clientCity: item.clientCity, distanceKm: item.distanceKm, travelFee: item.travelFee, servicePrice: item.servicePrice, totalPrice: item.totalPrice } : mockAdminData(data);
      }
      if (method === 'setAppointmentStatus') { requireMockPin(data, args[0]); const item = data.appointments.find(x => x.id === args[1]); item.status = args[2]; if (args[2] === 'completed') item.completedAt = new Date().toISOString(); saveMock(data); return mockAdminData(data); }
      if (method === 'saveSettings') {
        requireMockPin(data, args[0]); const input = args[1];
        data.settings = Object.assign({}, data.settings, input, { hasToken: data.settings.hasToken || Boolean(input.accessToken), accessToken: '' }); saveMock(data); return data.settings;
      }
      if (method === 'installAutomation') { requireMockPin(data, args[0]); data.automationInstalled = true; saveMock(data); return { ok: true, installed: true }; }
      if (method === 'sendTestMessage') { requireMockPin(data, args[0]); return { ok: true, status: '200', detail: 'Anteprima locale: invio simulato.' }; }
      throw new Error('Funzione demo non disponibile: ' + method);
    }

    function setupCityAutocomplete(input, onSelect) {
      const list = document.getElementById('citySuggestions');
      let matches = [];
      let active = -1;
      const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
      const choose = index => {
        const city = matches[index];
        if (!city) return;
        input.value = city[0] + ', ' + city[1];
        close();
        if (onSelect) onSelect(city);
      };
      const paintActive = () => {
        list.querySelectorAll('.city-option').forEach((button, index) => button.classList.toggle('active', index === active));
      };
      const render = () => {
        const query = normalizeCitySearch(input.value);
        if (!query) return close();
        const starts = [];
        const contains = [];
        for (let index = 0; index < ITALIAN_CITIES.length && starts.length + contains.length < 24; index++) {
          const city = ITALIAN_CITIES[index];
          const name = normalizeCitySearch(city[0]);
          const province = String(city[1] || '').toLowerCase();
          if (name.startsWith(query) || province === query) starts.push(city);
          else if (name.includes(query)) contains.push(city);
        }
        matches = starts.concat(contains).slice(0, 10);
        if (!matches.length) {
          list.innerHTML = '<div class="hint" style="padding:10px">Nessun comune trovato.</div>';
        } else {
          list.innerHTML = matches.map((city, index) => `<button type="button" class="city-option" data-city-option="${index}"><strong>${escapeHtml(city[0])}</strong><span>${escapeHtml(city[1])}</span></button>`).join('');
        }
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
        active = -1;
      };
      input.addEventListener('input', render);
      input.addEventListener('focus', render);
      input.addEventListener('keydown', event => {
        if (list.hidden || !matches.length) return;
        if (event.key === 'ArrowDown') { event.preventDefault(); active = Math.min(matches.length - 1, active + 1); paintActive(); }
        if (event.key === 'ArrowUp') { event.preventDefault(); active = Math.max(0, active - 1); paintActive(); }
        if (event.key === 'Enter' && active >= 0) { event.preventDefault(); choose(active); }
        if (event.key === 'Escape') close();
      });
      list.addEventListener('mousedown', event => event.preventDefault());
      list.addEventListener('click', event => {
        const option = event.target.closest('[data-city-option]');
        if (option) choose(Number(option.dataset.cityOption));
      });
      input.addEventListener('blur', () => setTimeout(close, 120));
    }

        <div class="trust-bar"><div class="trust-item"><span class="trust-dot"></span>Orari sempre aggiornati</div><div class="trust-item"><span class="trust-dot"></span>Conferma su WhatsApp</div><div class="trust-item"><span class="trust-dot"></span>Prenotazione semplice e veloce</div></div>
        ${!isAppsScript ? '<div class="notice info"><strong>Questa \u00e8 una simulazione.</strong> Puoi provare tutte le schermate, ma da questa anteprima non partir\u00e0 nessun messaggio WhatsApp reale.</div>' : ''}
        <div class="booking-grid">
          <section class="panel booking-step"><div class="panel-head"><div class="step-heading"><span class="step-number">01</span><h2>Scegli l'orario</h2></div></div><div id="slotList" class="stack"><div class="loading" style="min-height:180px"><div class="spinner"></div></div></div></section>
          <section class="panel booking-step booking-form-panel"><div class="panel-head"><div class="step-heading"><span class="step-number">02</span><h2>I tuoi dati</h2></div></div><div id="slotSummary" class="summary-box">Seleziona prima un orario disponibile.</div>
            <form id="bookingForm" class="field-grid">
              <div class="field full"><label for="service">Trattamento</label><select id="service" required><option value="">Scegli\u2026</option>${config.services.map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(serviceLabel(s))}</option>`).join('')}</select></div>
              ${config.homeServiceEnabled ? `<div class="field full"><label for="clientCity">Comune del massaggio a domicilio</label><div class="input-action"><div class="city-picker"><input id="clientCity" autocomplete="off" placeholder="Cerca un comune italiano" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="citySuggestions" required><div id="citySuggestions" class="city-suggestions" role="listbox" hidden></div></div><button id="travelButton" class="btn" type="button">Calcola</button></div><span class="hint">Seleziona il comune dalla tendina. Fino a ${escapeHtml(config.includedDistanceKm || 15)} km \u00e8 gratuito; oltre la soglia viene calcolato l'intero tragitto A/R.</span></div>` : ''}
              <div id="priceSummary" class="travel-summary field full"><strong>Riepilogo prezzo</strong><p>Scegli prima il trattamento.</p></div>

              <div class="field"><label for="phone">WhatsApp</label><input id="phone" type="tel" placeholder="+39\u2026" autocomplete="tel" required></div>

              <div class="field full"><label for="notes">Note <span class="muted">(facoltative)</span></label><textarea id="notes" placeholder="Ad esempio: zona dolorante o indicazioni utili"></textarea></div>

              <div class="field full"><button class="btn primary" type="submit">Conferma prenotazione</button></div>
            </form>
          </section>
        </div>${publicConnectPanel(config)}`;
      const slotGroups = await api('getAvailableSlots');

        slotList.innerHTML = slotGroups.map(group => `<div class="date-group"><div class="date-label">${escapeHtml(group.label)}</div><div class="slots">${group.slots.map(slot => `<button type="button" class="slot" data-date="${escapeHtml(group.date)}" data-label="${escapeHtml(group.label)}" data-time="${escapeHtml(slot.time)}">${escapeHtml(slot.time)}</button>`).join('')}</div></div>`).join('');
        document.querySelectorAll('.slot').forEach(button => button.addEventListener('click', () => {
          document.querySelectorAll('.slot').forEach(item => item.classList.remove('selected'));
          button.classList.add('selected');
          state.selectedSlot = { date: button.dataset.date, dateLabel: button.dataset.label, time: button.dataset.time };
          document.getElementById('slotSummary').textContent = `${state.selectedSlot.dateLabel} alle ${state.selectedSlot.time}`;
        }));
      }
      document.getElementById('service').addEventListener('change', updateBookingPriceSummary);
      if (config.homeServiceEnabled) {
        const cityInput = document.getElementById('clientCity');
        const travelButton = document.getElementById('travelButton');
        cityInput.addEventListener('input', () => {
          state.travelQuote = null;
          state.travelCityKey = '';
          updateBookingPriceSummary();
        });
        setupCityAutocomplete(cityInput, () => {
          state.travelQuote = null;
          state.travelCityKey = '';
          updateBookingPriceSummary();
          calculateCustomerTravel(travelButton).catch(error => showToast(error.message, 'error'));
        });
        travelButton.addEventListener('click', () => {
          calculateCustomerTravel(travelButton).catch(error => showToast(error.message, 'error'));
        });
      }
      document.getElementById('bookingForm').addEventListener('submit', submitBooking);

    async function submitBooking(event) {
      event.preventDefault();
      if (!state.selectedSlot) return showToast('Scegli prima un orario.', 'error');
      const config = state.bootstrap.publicConfig;
      if (config.homeServiceEnabled && (!state.travelQuote || state.travelCityKey !== customerCityKey())) {
        try { await calculateCustomerTravel(document.getElementById('travelButton')); }
        catch (error) { return showToast(error.message, 'error'); }
      }
      const button = event.currentTarget.querySelector('button[type="submit"]');
      setBusy(button, true, 'Prenotazione\u2026');
      try {
        const result = await api('createBooking', {
          clientName: document.getElementById('clientName').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          service: document.getElementById('service').value,
          clientCity: document.getElementById('clientCity') ? document.getElementById('clientCity').value : '',
          notes: document.getElementById('notes').value,
          date: state.selectedSlot.date,
          time: state.selectedSlot.time,
          consent: document.getElementById('consent').checked
        });
        app.innerHTML = `${publicTopbar(state.bootstrap.publicConfig)}<section class="panel success-card"><div class="success-icon">\u2713</div><h1>Prenotazione ricevuta</h1><p class="muted">Appuntamento per il <strong>${escapeHtml(result.dateLabel)}</strong> alle <strong>${escapeHtml(result.time)}</strong>.</p>${config.homeServiceEnabled ? `<div class="travel-summary" style="max-width:440px;margin:18px auto;text-align:left"><div class="price-line"><span>Trattamento</span><b>${money(result.servicePrice)}</b></div><div class="price-line"><span>Supplemento domicilio</span><b>${Number(result.travelFee || 0) ? money(result.travelFee) : 'GRATIS'}</b></div><div class="price-line total"><span>Totale</span><b>${money(result.totalPrice)}</b></div></div>` : ''}<p>${isAppsScript ? 'Riceverai le comunicazioni su WhatsApp.' : '<strong>Simulazione:</strong> nessun messaggio WhatsApp reale \u00e8 stato inviato.'}</p><button type="button" class="btn primary" data-go-view="book">Fine</button></section>${publicConnectPanel(state.bootstrap.publicConfig)}`;
      } catch (error) {
        showToast(error.message, 'error'); setBusy(button, false);
      }
    }

    function renderAuth(config, setup) {
      const brand = businessBrand(config.businessName);
      app.className = 'shell';
      app.innerHTML = `<div class="auth-wrap"><section class="auth-card">${brandLogoMarkup()}<div class="eyebrow">LocalFlow \u00b7 Gestione</div><h1>${setup ? 'Crea il PIN amministratore' : 'Area gestione'}</h1><p class="muted">${setup ? 'Scegli un PIN da 4 a 8 numeri. Servir\u00e0 per proteggere agenda e dati dei clienti.' : 'Inserisci il PIN scelto durante la configurazione.'}</p>${!isAppsScript ? '<div class="notice info">Stai usando una simulazione: i dati restano in questo browser e non vengono inviati messaggi reali.</div>' : ''}<form id="authForm" class="stack"><div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required></div><button class="btn primary" type="submit">${setup ? 'Crea PIN' : 'Entra'}</button></form><div class="actions"><button type="button" class="btn small" data-go-view="book">Apri pagina prenotazioni</button></div></section></div>`;
      document.getElementById('authForm').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.currentTarget.querySelector('button'); setBusy(button, true);
        try {
          const pin = document.getElementById('pin').value;
          const data = setup ? await api('initializeAdmin', pin) : await api('getAdminData', pin);
          state.pin = pin; sessionStorage.setItem('localflow-pin', pin); state.adminData = data;
          if (!state.adminData || !state.adminData.settings) await refreshAdminData();
          renderAdmin();
        } catch (error) { showToast(error.message, 'error'); setBusy(button, false); }
      });

    function adminHeader() {
      const data = state.adminData;
      const brand = businessBrand(data.settings.businessName);
      return `<div class="topbar admin-topbar"><div class="brand-lockup">${brandLogoMarkup()}<div><div class="eyebrow">LocalFlow \u00b7 Gestione</div><h1>${escapeHtml(brand.primary)}</h1><p class="subtitle">Agenda, prenotazioni e reputazione online</p></div></div><div class="top-actions">${data.settings.testMode ? '<span class="badge test">WhatsApp prova</span>' : '<span class="badge">WhatsApp produzione</span>'}<button type="button" class="btn small" data-go-view="book">Pagina clienti</button><button id="logoutBtn" class="btn small">Esci</button></div></div>

    }

    function renderAdmin() {
      if (!state.adminData || !state.adminData.settings) {

    function renderAgenda() {
      const data = state.adminData;
      document.getElementById('adminContent').innerHTML = `<div class="stats"><div class="stat"><div class="stat-label">Prossimi appuntamenti</div><div class="stat-value">${data.stats.upcoming}</div></div><div class="stat"><div class="stat-label">Completati</div><div class="stat-value">${data.stats.completed}</div></div><div class="stat"><div class="stat-label">Clienti registrati</div><div class="stat-value">${data.stats.clients}</div></div><div class="stat"><div class="stat-label">Richieste recensione</div><div class="stat-value">${data.stats.reviewRequests}</div></div></div>

    function appointmentCard(item) {
      const statusLabel = item.status === 'completed' ? 'Completato' : item.status === 'cancelled' ? 'Annullato' : 'Programmato';
      const flag = (label, value) => `<span class="flag ${String(value).startsWith('sent') ? 'sent' : String(value).startsWith('failed') ? 'failed' : ''}">${String(value).startsWith('sent') ? '\u2713' : String(value).startsWith('failed') ? '!' : '\u2022'} ${label}</span>`;
      const details = [item.service, item.servicePrice ? money(item.servicePrice) : '', item.serviceDuration ? item.serviceDuration + ' min' : ''].filter(Boolean).join(' \u00b7 ');
      const travelDetails = item.clientCity
        ? `<p>Domicilio: ${escapeHtml(item.clientCity)} \u00b7 ${escapeHtml(item.distanceKm || 0)} km \u00b7 Supplemento ${Number(item.travelFee || 0) ? money(item.travelFee) : 'GRATIS'} \u00b7 Totale ${money(item.totalPrice || Number(item.servicePrice || 0) + Number(item.travelFee || 0))}</p>`
        : '';
      return `<article class="appointment"><div class="appointment-top"><div><h3>${escapeHtml(item.clientName)}</h3><p>${escapeHtml(details)} \u00b7 ${escapeHtml(mockDateLabel(item.date))} alle ${escapeHtml(item.time)}</p><p>WhatsApp: +${escapeHtml(item.phone)}</p>${travelDetails}</div><span class="status ${escapeHtml(item.status)}">${statusLabel}</span></div><div class="message-flags">${flag('Conferma', item.confirmationStatus)}${flag('Promemoria', item.reminderStatus)}${flag('Recensione', item.reviewStatus)}</div>${item.status === 'scheduled' ? `<div class="appointment-actions"><button class="btn success small" data-id="${escapeHtml(item.id)}" data-status-action="completed">Segna completato</button><button class="btn danger small" data-id="${escapeHtml(item.id)}" data-status-action="cancelled">Annulla</button></div>` : ''}</article>`;
    }

      document.getElementById('adminContent').innerHTML = `<div class="grid"><section class="panel"><h2>Aggiungi orari</h2><p class="muted">Puoi pubblicare anche gli orari di oggi. Saranno mostrati ai clienti in base al preavviso minimo impostato.</p><form id="availabilityForm" class="stack"><div class="field"><label>Data</label><input id="availableDate" type="date" min="${localTodayIso()}" value="${localTodayIso()}" required></div><div class="field"><label>Orari</label><input id="availableTimes" placeholder="09:00, 11:00, 15:00" required><span class="hint">Formato 24 ore, ad esempio 10:30.</span></div><button class="btn primary" type="submit">Pubblica disponibilit\u00e0</button></form></section><section class="panel"><div class="panel-head"><h2>Orari pubblicati</h2><span class="muted">${data.availability.length}</span></div><div class="availability-list">${Object.keys(grouped).length ? Object.keys(grouped).sort().map(date => `<div class="availability-item"><div><h3>${escapeHtml(mockDateLabel(date))}</h3><p class="muted" style="margin:0">${grouped[date].map(x => escapeHtml(x.time)).join(' \u00b7 ')}</p></div><div class="actions" style="margin:0">${grouped[date].map(x => `<button class="btn danger small" data-remove-slot="${escapeHtml(x.id)}">${escapeHtml(x.time)} \u00d7</button>`).join('')}</div></div>`).join('') : '<div class="empty">Nessun orario pubblicato.</div>'}</div></section></div>`;
      document.getElementById('availabilityForm').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.currentTarget.querySelector('button'); setBusy(button, true);

          <label class="check"><input id="testMode" type="checkbox" ${s.testMode ? 'checked' : ''}><span>Modalit\u00e0 prova attiva: usa il modello Meta <strong>hello_world</strong>.</span></label>
          <div class="field"><label>ID numero di telefono di prova</label><input id="phoneNumberId" value="${escapeHtml(s.phoneNumberId)}" inputmode="numeric"><span class="hint">\u00c8 indicato nella schermata Configurazione API di Meta.</span></div>
          <div class="field"><label>Token di accesso ${s.hasToken ? '<span class="muted">(gi\u00e0 salvato)</span>' : ''}</label><input id="accessToken" type="password" placeholder="${s.hasToken ? 'Lascia vuoto per non cambiarlo' : 'Incolla il token temporaneo'}"><span class="hint">Il token viene conservato nelle propriet\u00e0 protette del progetto e non appare nella pagina pubblica.</span></div>
          <div class="field"><label>Versione Graph API</label><input id="graphVersion" value="${escapeHtml(s.graphVersion)}" pattern="v[0-9]+\\.[0-9]+"></div>
          <details><summary>Modelli per la produzione</summary><div class="stack" style="margin-top:12px"><div class="field"><label>Conferma</label><input id="confirmationTemplate" value="${escapeHtml(s.confirmationTemplate)}"></div><div class="field"><label>Promemoria</label><input id="reminderTemplate" value="${escapeHtml(s.reminderTemplate)}"></div><div class="field"><label>Recensione</label><input id="reviewTemplate" value="${escapeHtml(s.reviewTemplate)}"></div></div></details>
          <button class="btn primary" type="submit">Salva impostazioni</button>
        </form></section>
        <section class="stack"><div class="panel"><h2>Test invio</h2><p class="muted">Usa uno dei destinatari verificati nella schermata Meta.</p><form id="testForm" class="stack"><div class="field"><label>Numero destinatario</label><input id="testPhone" type="tel" placeholder="+39\u2026" required></div><button class="btn" type="submit">Invia hello_world</button></form></div>
          <div class="panel"><h2>Controllo automatico</h2><p class="muted">Ogni 5 minuti LocalFlow controller\u00e0 conferme, promemoria e richieste di recensione da inviare.</p><div class="notice ${state.adminData.automationInstalled ? 'success' : ''}">${state.adminData.automationInstalled ? 'Automazione attiva.' : 'Automazione non ancora attiva.'}</div><button id="automationBtn" class="btn ${state.adminData.automationInstalled ? '' : 'primary'}">${state.adminData.automationInstalled ? 'Reinstalla controllo' : 'Attiva controllo automatico'}</button></div>
          <div class="panel"><h2>Link pubblici</h2><p class="muted">Link da condividere con i clienti.</p><div class="field"><label>Prenotazioni</label><input id="bookingUrl" readonly value="${escapeHtml(baseUrl + '?view=book')}"></div><div class="actions"><button id="copyLinkBtn" class="btn small">Copia prenotazioni</button></div><div class="divider"></div><div class="field"><label>Pagina catalogo per Meta</label><input id="catalogPageUrl" readonly value="${escapeHtml(baseUrl + '?view=catalog')}"></div><div class="actions"><button id="copyCatalogLinkBtn" class="btn small">Copia pagina catalogo</button></div></div>
        </section></div>`;
      document.getElementById('settingsForm').addEventListener('submit', saveSettingsForm);
      document.getElementById('testForm').addEventListener('submit', sendTestForm);
      document.getElementById('addServiceBtn').addEventListener('click', () => {
        document.getElementById('serviceEditor').insertAdjacentHTML('beforeend', serviceEditorRow({ name: '', price: 0, duration: 60 }));
      });
      document.getElementById('serviceEditor').addEventListener('click', event => {
        const remove = event.target.closest('[data-remove-service]');
        if (!remove) return;
        const rows = document.querySelectorAll('[data-service-row]');
        if (rows.length <= 1) return showToast('Deve rimanere almeno un trattamento.', 'error');
        remove.closest('[data-service-row]').remove();
      });
      const toggleHomeFields = () => {
        const enabled = document.getElementById('homeServiceEnabled').checked;
        const box = document.getElementById('homeServiceFields');
        box.classList.toggle('disabled', !enabled);
        box.querySelectorAll('input').forEach(input => { input.disabled = !enabled; });
      };
      document.getElementById('homeServiceEnabled').addEventListener('change', toggleHomeFields);
      toggleHomeFields();
      document.getElementById('automationBtn').addEventListener('click', async event => { setBusy(event.currentTarget, true); try { await api('installAutomation', state.pin); state.adminData.automationInstalled = true; showToast('Controllo automatico attivato.'); renderAdmin(); } catch (error) { showToast(error.message, 'error'); setBusy(event.currentTarget, false); } });
      document.getElementById('copyLinkBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText(document.getElementById('bookingUrl').value); showToast('Link copiato.'); } catch (error) { showToast('Il link sar\u00e0 copiabile dopo la pubblicazione.', 'error'); } });
      document.getElementById('copyCatalogLinkBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText(document.getElementById('catalogPageUrl').value); showToast('Link catalogo copiato.'); } catch (error) { showToast('Il link sar\u00e0 copiabile dopo la pubblicazione.', 'error'); } });
    }

    async function saveSettingsForm(event) {
      event.preventDefault(); const button = event.currentTarget.querySelector('button[type="submit"]'); setBusy(button, true);
      try {
        const settings = await api('saveSettings', state.pin, {
          businessName: document.getElementById('businessName').value, signature: document.getElementById('signature').value,
          reviewUrl: document.getElementById('reviewUrl').value, instagramUrl: document.getElementById('instagramUrl').value,
          catalogUrl: document.getElementById('catalogUrl').value, reviewDelayHours: document.getElementById('reviewDelayHours').value,
          minimumBookingNoticeMinutes: document.getElementById('minimumBookingNoticeMinutes').value,
          homeServiceEnabled: document.getElementById('homeServiceEnabled').checked,
          baseLocation: document.getElementById('baseLocation').value,
          fuelPricePerLiter: document.getElementById('fuelPricePerLiter').value,
          fuelConsumptionPer100Km: document.getElementById('fuelConsumptionPer100Km').value,
          includedDistanceKm: document.getElementById('includedDistanceKm').value,
          testMode: document.getElementById('testMode').checked, phoneNumberId: document.getElementById('phoneNumberId').value,
          accessToken: document.getElementById('accessToken').value, graphVersion: document.getElementById('graphVersion').value,
          confirmationTemplate: document.getElementById('confirmationTemplate').value, reminderTemplate: document.getElementById('reminderTemplate').value,
          reviewTemplate: document.getElementById('reviewTemplate').value, languageCode: state.adminData.settings.languageCode,
          services: collectServices()
        });
        state.adminData.settings = settings; showToast('Impostazioni salvate.'); renderAdmin();
      } catch (error) { showToast(error.message, 'error'); setBusy(button, false); }
    }

    async function sendTestForm(event) {
      event.preventDefault(); const button = event.currentTarget.querySelector('button'); setBusy(button, true, 'Invio\u2026');
      try { const result = await api('sendTestMessage', state.pin, document.getElementById('testPhone').value); if (!result.ok) throw new Error('Invio non riuscito: ' + result.detail); showToast(isAppsScript ? 'Messaggio di prova inviato.' : 'Simulazione completata: nessun messaggio reale \u00e8 stato inviato.'); setBusy(button, false); }
      catch (error) { showToast(error.message, 'error'); setBusy(button, false); }
    }

    async function start() {
      try {
        state.bootstrap = await api('getBootstrap', state.view);
        if (state.view === 'book') return renderBooking();
        if (state.view === 'catalog') return renderCatalog();
        if (!state.bootstrap.configured) return renderAuth(state.bootstrap.publicConfig, true);
        if (state.pin) {
          try { state.adminData = await api('getAdminData', state.pin); return renderAdmin(); }
          catch (error) { sessionStorage.removeItem('localflow-pin'); state.pin = ''; }
        }
        renderAuth(state.bootstrap.publicConfig, false);
      } catch (error) {
        app.className = 'shell';
        app.innerHTML = `<section class="panel"><h1>Impossibile avviare LocalFlow</h1><p class="muted">${escapeHtml(error.message)}</p></section>`;
      }
    }
    start();
  </script>
</body>
</html>
